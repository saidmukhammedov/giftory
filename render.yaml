# One service: builds the React app, then Express serves it and the API.
services:
  - type: web
    name: giftory
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: cd client && npm ci && npm run build && cd ../server && npm ci --omit=dev
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "22"
