<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giftory: shared wishlists</title>
    <meta name="description" content="Make a wishlist, share one link, and friends reserve gifts in secret. Nobody doubles up." />
    <meta property="og:title" content="Giftory: shared wishlists" />
    <meta property="og:description" content="Make a wishlist, share one link, and friends reserve gifts in secret." />
    <meta property="og:image" content="https://giftory.uz/og.png" />
    <meta property="og:url" content="https://giftory.uz" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Giftory" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#F4F4F1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      try {
        if (localStorage.getItem('giftory_theme') === 'dark') document.documentElement.classList.add('dark');
        document.documentElement.lang = localStorage.getItem('giftory_lang') || 'en';
      } catch (e) {}
    </script>
    <style>html{background:#F4F4F1;color:#000;font-family:system-ui,sans-serif}html.dark{background:#161614;color:#F2F1EC}</style>
  </head>
  <body>
    <div id="root">
      <div class="boot"><span class="display">giftory</span><p class="boot-late">Taking a while? <a href="/">Reload the page</a></p></div>
    </div>
    <script>
      try {
        var late = { uz: ['Uzoq yuklanyaptimi?', 'Sahifani yangilang'], ru: ['Долго загружается?', 'Обновите страницу'] }[document.documentElement.lang];
        if (late) {
          var p = document.querySelector('.boot-late');
          p.firstChild.nodeValue = late[0] + ' ';
          p.lastChild.textContent = late[1];
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
