<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giftory: shared wishlists</title>
    <!-- Apply saved theme and language before first paint, so there is no flash -->
    <script>
      try {
        if (localStorage.getItem('giftory_theme') === 'dark') document.documentElement.classList.add('dark');
        document.documentElement.lang = localStorage.getItem('giftory_lang') || 'en';
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,400..1000&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
